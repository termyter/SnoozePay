<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1800" />
  <title>SnoozePay · Полный обзор проекта</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components/components.css" />
  <style>
    body { background: #060912; }
    .phone { transform: scale(.78); transform-origin: top center; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-theme="dark">
  <div id="root"></div>

  <script type="text/babel" src="components/SPComponents.jsx"></script>
  <script type="text/babel" src="components/SPScreensV2.jsx"></script>
  <script type="text/babel" src="components/SPDawnV3.jsx"></script>
  <script type="text/babel" src="components/SPMore.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    function App() {
      return (
        <DesignCanvas
          title="SnoozePay · Полный обзор"
          subtitle="Все экраны проекта в одном холсте. Перетащите карточку для перестановки, дважды нажмите по любой — откроется в полный экран. Скажите «поправь screen N» — я знаю про какой."
        >
          <DCSection id="onboarding" title="01 · Онбординг">
            <DCArtboard id="onb-1" label="1.1 · Что такое SnoozePay" width={420} height={900}>
              <Phone theme="dark"><Onboarding1 /></Phone>
            </DCArtboard>
            <DCArtboard id="onb-2" label="1.2 · Как это работает" width={420} height={900}>
              <Phone theme="dark"><Onboarding2 /></Phone>
            </DCArtboard>
            <DCArtboard id="onb-3" label="1.3 · Первый залог" width={420} height={900}>
              <Phone theme="dark"><Onboarding3 /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="firing" title="02 · Будильник срабатывает (канон)">
            <DCArtboard id="firing-canon" label="2.1 · Обычный снуз 50 ₽ (канон)" width={420} height={900}>
              <Phone theme="dark"><FiringDawn /></Phone>
            </DCArtboard>
            <DCArtboard id="firing-progressive" label="2.2 · Прогрессив, 4-й снуз" width={420} height={900}>
              <Phone theme="dark"><FiringDawn progressive /></Phone>
            </DCArtboard>
            <DCArtboard id="firing-no-balance" label="2.3 · Залог закончился" width={420} height={900}>
              <Phone theme="dark"><FiringNoBalanceV2 /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="main" title="03 · Главный флоу">
            <DCArtboard id="alarms-list" label="3.1 · Список будильников" width={420} height={900}>
              <Phone theme="dark"><AlarmsListDawn /></Phone>
            </DCArtboard>
            <DCArtboard id="alarms-empty" label="3.2 · Пустой список" width={420} height={900}>
              <Phone theme="dark"><EmptyAlarms /></Phone>
            </DCArtboard>
            <DCArtboard id="create-alarm" label="3.3 · Создание будильника" width={420} height={900}>
              <Phone theme="dark"><CreateAlarmDawn /></Phone>
            </DCArtboard>
            <DCArtboard id="sound-picker" label="3.4 · Выбор звука" width={420} height={900}>
              <Phone theme="dark"><SoundPicker /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="wallet-stats" title="04 · Кошелёк и статистика">
            <DCArtboard id="wallet" label="4.1 · Залог + пополнение" width={420} height={900}>
              <Phone theme="dark"><WalletDawn /></Phone>
            </DCArtboard>
            <DCArtboard id="stats" label="4.2 · Статистика" width={420} height={900}>
              <Phone theme="dark"><Statistics /></Phone>
            </DCArtboard>
            <DCArtboard id="stats-empty" label="4.3 · Статистика — пусто" width={420} height={900}>
              <Phone theme="dark"><EmptyStats /></Phone>
            </DCArtboard>
          </DCSection>

          <DCSection id="moments-settings" title="05 · Моменты и настройки">
            <DCArtboard id="streak" label="5.1 · Streak — 7 дней без снуза" width={420} height={900}>
              <Phone theme="dark"><StreakModalDawn /></Phone>
            </DCArtboard>
            <DCArtboard id="settings" label="5.2 · Настройки" width={420} height={900}>
              <Phone theme="dark"><Settings /></Phone>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
