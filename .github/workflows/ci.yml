name: CI

# #1038: preserve the complete selected test set while reducing CI overhead.
# Intel experiment 40132195818 exceeded the ARM baseline and was cancelled.
# Keep the supported ARM runner; build and test in one xcodebuild invocation.
# TEST_HOST stays: existing tests assert the app bundle, resources and UIKit scene.
# All cached lanes and the uncached nightly lane remain ARM.
# Do not add manual parallel boot/build: it previously worsened 325s to 444s
# (run 33157073616). The temporary UI opt-in below is unchanged.
on:
  push:
    branches:
      - main
      - design-refresh-2026-04-27
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 02:37 UTC — некруглая минута намеренно: на '0 2' GitHub задерживал прогон на 6.5 ч (#524).
    - cron: '37 2 * * *'
  workflow_dispatch:

# Новый коммит в ту же ветку/PR отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: SnoozePay/SnoozePay.xcodeproj
  SCHEME: SnoozePay
  # Относительный путь: одинаковый на раннере и в любом worktree, поэтому
  # кэш DerivedData переносится между прогонами без инвалидации по пути.
  DD: DerivedData
  # COMPILER_INDEX_STORE_ENABLE=NO — индекс нужен Xcode.app для автодополнения,
  # на CI это чистые потери. DEBUG_INFORMATION_FORMAT=dwarf — не генерим dSYM.
  FAST_BUILD: >-
    COMPILER_INDEX_STORE_ENABLE=NO
    DEBUG_INFORMATION_FORMAT=dwarf
    CODE_SIGNING_ALLOWED=NO

jobs:
  # ── 16 с. Дёшево, гоняется всегда. ────────────────────────────────────────
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      # Версию печатаем осознанно: локально у PM стоит 0.52.2, здесь brew ставит
      # свежий, и на дефолтах они расходились на 11 errors. Теперь пороги
      # зафиксированы в .swiftlint.yml, но при следующем расхождении первым
      # вопросом будет «а какая тут версия».
      - name: SwiftLint version
        run: swiftlint version
      - name: Run SwiftLint
        run: swiftlint lint --quiet SnoozePay/SnoozePay

  # Required PR gate; the 60s target is not an established duration.
  unit:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Xcode 26.5 — та же версия, что локально. На 26.4.1 + старом runtime
      # test host падал с malloc-ошибкой на каждом тесте.
      - name: Select Xcode 26.5
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Runner capacity
        run: |
          test "$(uname -m)" = "arm64"
          sysctl hw.logicalcpu hw.memsize
          xcodebuild -version

      # Кэш только ВОССТАНАВЛИВАЕМ на PR — писать с каждого PR значит выбить
      # из 10-гигабайтного лимита все полезные записи. Пишет только push
      # в основную ветку (см. шаг «Save DerivedData» ниже).
      - name: Restore DerivedData
        id: dd
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DD }}
          key: dd-xc26.5-${{ hashFiles('SnoozePay/SnoozePay.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            dd-xc26.5-${{ hashFiles('SnoozePay/SnoozePay.xcodeproj/project.pbxproj') }}-
            dd-xc26.5-

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS"))) | sort_by(.key) | last
            | .value | map(select(.name | contains("iPhone"))) | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # The temporary UI flag pauses exactly two complete window-driven
      # UITour suites here, including their non-presentation assertions.
      # One invocation builds and runs the selected unit tests.
      # Keep serial execution and report build timings for the combined step.
      - name: Build and run unit tests
        env:
          UI_E2E_ENABLED: ${{ vars.SNOOZEPAY_UI_E2E_ENABLED == 'true' }}
        run: |
          E2E_TEST_SCOPE=()
          if [ "$UI_E2E_ENABLED" != "true" ]; then
            E2E_TEST_SCOPE=(
              -skip-testing:SnoozePayTests/UITourWarningRoutesTests
              -skip-testing:SnoozePayTests/UITourConfirmDeleteRouteTests
            )
          fi
          xcodebuild test \
            "${E2E_TEST_SCOPE[@]}" \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }},arch=arm64" \
            -derivedDataPath "$DD" \
            -only-testing:SnoozePayTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            -showBuildTimingSummary \
            $FAST_BUILD

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 7

      # Индекс и логи в кэше не нужны — только раздувают запись.
      - name: Prune DerivedData
        if: github.event_name == 'push'
        run: rm -rf "$DD/Index" "$DD/Logs" "$DD/ModuleCache.noindex/Session"* || true

      - name: Save DerivedData
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DD }}
          key: dd-xc26.5-${{ hashFiles('SnoozePay/SnoozePay.xcodeproj/project.pbxproj') }}-${{ github.sha }}

  # ── 145 с ради 5 кейсов. Уведено с критического пути PR. ──────────────────
  # PM temporarily paused E2E on 2026-10-24 to reduce background CI work.
  # Re-enable with repository Actions variable SNOOZEPAY_UI_E2E_ENABLED=true.
  # The original event/PR-label selector remains in place behind that opt-in.
  uitests:
    name: UI tests (E2E)
    if: >-
      vars.SNOOZEPAY_UI_E2E_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'ui-test'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DD }}
          key: dd-xc26.5-${{ hashFiles('SnoozePay/SnoozePay.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            dd-xc26.5-${{ hashFiles('SnoozePay/SnoozePay.xcodeproj/project.pbxproj') }}-
            dd-xc26.5-

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS"))) | sort_by(.key) | last
            | .value | map(select(.name | contains("iPhone"))) | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DD" \
            -quiet \
            $FAST_BUILD

      - name: Run UI tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DD" \
            -only-testing:SnoozePayUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath UITestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 7

  # ── Страховка от «ложного green». ─────────────────────────────────────────
  # Кэш DerivedData ускоряет PR, но инкрементальная сборка теоретически может
  # не заметить новый файл и дать зелёный прогон на непроверенном коде. Раз в
  # сутки собираем с нуля без кэша. Unit target исключает два UI-tour suites
  # при выключенном флаге; UI target запускается только при opt-in выше.
  # Если ночной прогон
  # красный, а дневные зелёные — виноват кэш, а не код.
  clean-build:
    name: Clean build (no cache)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.5
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS"))) | sort_by(.key) | last
            | .value | map(select(.name | contains("iPhone"))) | first | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & Test (clean)
        env:
          UI_E2E_ENABLED: ${{ vars.SNOOZEPAY_UI_E2E_ENABLED == 'true' }}
        run: |
          E2E_TEST_SCOPE=()
          if [ "$UI_E2E_ENABLED" != "true" ]; then
            E2E_TEST_SCOPE=(
              -only-testing:SnoozePayTests
              -skip-testing:SnoozePayTests/UITourWarningRoutesTests
              -skip-testing:SnoozePayTests/UITourConfirmDeleteRouteTests
            )
          fi
          xcodebuild test \
            "${E2E_TEST_SCOPE[@]}" \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath CleanTestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-test-results
          path: CleanTestResults.xcresult
          retention-days: 7
