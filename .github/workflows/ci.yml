name: CI

# Когда запускать пайплайн:
#  - на каждый push в основные ветки (main + интеграционная design-refresh)
#  - на каждый pull request (любой), чтобы красные тесты ловились ДО merge
on:
  push:
    branches:
      - main
      - design-refresh-2026-04-27
  pull_request:

# Если в ту же ветку/PR прилетает новый коммит — отменяем предыдущий прогон,
# чтобы не жечь раннеры на устаревших коммитах.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # На свежих образах GitHub swiftlint больше НЕ предустановлен — ставим сами.
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint version
        run: swiftlint version
      # Дефолтный конфиг (как в проекте) — падаем только на ошибках, не на warnings.
      - name: Run SwiftLint
        run: swiftlint lint --quiet SnoozePay/SnoozePay

  build-test:
    name: Build & Test (iOS Simulator)
    # macos-26 — единственный образ с Xcode 26 / iOS 26 SDK. Проект требует
    # IPHONEOS_DEPLOYMENT_TARGET = 26.2, поэтому macos-15 (Xcode 16) не соберёт.
    runs-on: macos-26
    env:
      PROJECT: SnoozePay/SnoozePay.xcodeproj
      SCHEME: SnoozePay
    steps:
      - uses: actions/checkout@v4

      # Выбираем Xcode 26.5 — ту же версию, что и локально. На Xcode 26.4.1 +
      # старом iOS-runtime test host системно падал с malloc-ошибкой
      # («pointer being freed was not allocated») на каждом тесте.
      - name: Select Xcode 26.5
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' || true

      # Берём iPhone из САМОГО НОВОГО iOS-runtime на раннере (старый pick
      # хватал первый попавшийся UDID — мог быть runtime 26.2, см. выше).
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("iOS")))
            | sort_by(.key)
            | last
            | .value
            | map(select(.name | contains("iPhone")))
            | first
            | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available"; exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      # -parallel-testing-enabled NO: дефолтный параллельный прогон на клонах
      # симулятора роняет worker-процессы на слабом CI-раннере (3-4 vCPU) —
      # тесты массово «падают» за 0.000s, не запустившись. Последовательный
      # прогон медленнее, но детерминированный.
      - name: Build & Test
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Сохраняем .xcresult как артефакт даже при падении — можно скачать и
      # открыть в Xcode, чтобы посмотреть какой именно тест упал.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
