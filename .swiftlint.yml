# SwiftLint для SnoozePay.
#
# Встроенные правила — дефолтные, конфиг их не трогает. Здесь только custom_rules,
# которые ловят классы дефектов, специфичные для этого проекта.
#
# Строгость правила определяется одним признаком: есть ли под ним долг.
#
# `hardcoded_color` и `forced_dark_mode` — severity: warning, и это осознанно. На
# момент заведения конфига в коде уже ~30 нарушений; сделать их ошибкой значит
# покрасить лint и заблокировать все PR разом. CI (`swiftlint lint --quiet`)
# падает только на errors, поэтому warning'и видно, но они никого не держат. Долг
# чинится отдельными PR; когда счётчик дойдёт до нуля — правило поднимается до
# error, и класс закрыт навсегда.
#
# `literal_log_subsystem` заведено сразу с severity: error — по тому же критерию,
# с другой стороны: нарушений под ним ноль с самого начала (#747 свёл все восемь
# сайтов на `AppLogger.subsystem`), поэтому error не блокирует ничего заднего.
# Правило с warning здесь было бы декорацией: класс, который оно ловит, нельзя
# поймать ни тестом, ни ревью-вниманием.

custom_rules:

  # ── Кириллица в коде ─────────────────────────────────────────────────────
  # Эпик #569 выносит строки интерфейса в Localizable.xcstrings срез за срезом,
  # но доказательством «слой вычищен» служил только замер автора в теле PR.
  # Тестом класс не ловится в принципе: copy-сюита не отличает
  # `Localized.text("settings.section.finance")` от литерала «ФИНАНСЫ» — слова
  # те же. Литерал, дописанный в уже вычищенный файл, тихо отматывает эпик назад.
  #
  # `match_kinds: string` — то, ради чего правило вообще возможно: `///`-доки и
  # `[i18n]`-комментарии на русском остаются вне счёта. Проба в #734: на
  # SettingsViewController.swift с четырьмя подброшенными литералами правило
  # без match_kinds дало 22 срабатывания, с ним — ровно 4.
  #
  # Совпадение — от первой кириллической буквы до кавычки, `\` или конца строки,
  # а не одна буква: иначе «Готово» дало бы шесть предупреждений. `\` обрывает
  # совпадение перед интерполяцией — её токен не `string`, и совпадение, зашедшее
  # в неё, match_kinds отбросил бы целиком, то есть литерал с `\(…)` проходил бы.
  #
  # Литерал, оставленный СОЗНАТЕЛЬНО (имя будильника в фикстуре, сентинел
  # декодера, `AppIntent.title` — список ведёт count-cyrillic-literals.py),
  # несёт хвостовой `// i18n:exempt <причина>` на своей строке. Правило читает
  # тот же маркер (негативный lookahead), поэтому решение записано один раз, и
  # замер с линтом не могут разойтись. Маркер на ПРЕДЫДУЩЕЙ строке, который
  # замер тоже принимает, правило не видит — ставь его на строку литерала.
  # Голое `i18n:exempt` без причины не освобождает — как и в замере. Пробел
  # перед причиной — `[ \t]`, а не `\s`: `\s` берёт перевод строки, и причиной
  # голого маркера становилось первое слово СЛЕДУЮЩЕЙ строки (поймано пробой).
  #
  # `included` — шесть перечисленных каталогов таргета плюс файлы его корня
  # (AppDelegate, AppDelegate+*, SceneDelegate и любой новый корневой `.swift`).
  # Корень вошёл после #733 (#913): замер по нему даёт ноль. НОВЫЙ, седьмой
  # каталог таргета правило пропустит молча — впиши его в список. Каталоги
  # перечислены явно, а не `SnoozePay/SnoozePay/[^/]+/`: в CI путь к файлу —
  # `/Users/runner/work/SnoozePay/SnoozePay/SnoozePay/SnoozePay/…`, и общий
  # шаблон там цепляет лишнее (в том числе SnoozePayTests/), а локально — нет.
  # Корень — `[^/]+\.swift`: файл прямо под `SnoozePay/SnoozePay/`.
  #
  cyrillic_literal:
    name: "Кириллица в строковом литерале"
    regex: '[А-Яа-яЁё][^"\\\n]*(?![^\n]*i18n:exempt[ \t]+\S)'
    match_kinds: string
    included: ".*/SnoozePay/SnoozePay/((Models|Services|Utilities|ViewModels|ViewControllers|Views)/.*|[^/]+)\\.swift"
    message: "Строка на экране должна приходить из Localizable.xcstrings: заведи ключ и читай его через Localized.text/format. Если литерал оставлен сознательно — допиши на эту строку `// i18n:exempt <причина>`."
    severity: warning

  # ── Светлая тема ─────────────────────────────────────────────────────────
  # AppColors построен на UIColor(dynamicProvider:) и корректно отдаёт пару
  # light/dark для каждого токена. Ломают тему не токены, а обходы: белый текст,
  # прописанный руками, на экране, который тему уважает, в светлом режиме
  # становится невидимым.
  #
  # Экраны, осознанно тёмные всегда (Splash, Onboarding, Permissions, Firing,
  # WokeMorning, TopUp-шит), исключены: там хардкод — законный выбор.
  hardcoded_color:
    name: "Хардкод цвета мимо AppColors"
    regex: '(UIColor\(red:|UIColor\(white:|UIColor\(hex:|UIColor\.white|UIColor\.black|=\s*\.white\b|=\s*\.black\b)'
    included: ".*/(ViewControllers|Views)/.*\\.swift"
    excluded: ".*(AppColors|AppShadow|AlarmFiringThemePalette|AlarmThemeRendering|Splash|Onboarding|Permissions|AlarmFiring|WokeMorning|FiringTopUp|SPFiring|SPThemedFiring|SPWokeMorning|GradientMask|AlarmThemeTileCell|AlarmThemePicker).*\\.swift"
    message: "Цвет задан вручную. В светлой теме это даёт невидимый текст или тёмный блок на светлом фоне. Возьми токен из AppColors — он сам отдаёт нужный вариант."
    severity: warning

  # ── Принудительно тёмные экраны ──────────────────────────────────────────
  # Само по себе не грех: шесть экранов тёмные по дизайну. Но каждый новый такой
  # экран — это кусок приложения, выпадающий из темы, и решение должно быть
  # явным, а не случайным.
  forced_dark_mode:
    name: "Экран принудительно тёмный"
    regex: 'overrideUserInterfaceStyle\s*=\s*\.dark'
    included: ".*/(ViewControllers|Views)/.*\\.swift"
    excluded: ".*(Splash|Onboarding|Permissions|AlarmFiring|WokeMorning|FiringTopUp).*\\.swift"
    message: "Новый экран выключает себя из темы. Если так и задумано — добавь файл в excluded этого правила, чтобы решение осталось видимым."
    severity: warning

  # ── Подсистема os_log ────────────────────────────────────────────────────
  # `AppLogger.subsystem` читает bundle identifier из `Bundle.main`. Подсистема,
  # прописанная строкой, расходится с ним молча: она осталась
  # «Ivan-Emelyanov.SnoozePay» после переезда приложения на «io.mobilife.SnoozePay»
  # (#475/#476), и греп из тикета поддержки не находил ни одной строки (#670).
  #
  # Тестом класс не ловится в принципе: `OSLog`/`Logger` не отдают свою подсистему
  # обратно и не `Equatable`. Возврат литерала в любой из восьми файлов, сведённых
  # на `AppLogger.subsystem` в #747, оставляет все 1034 теста зелёными. Значит
  # проверка обязана быть построчной — ровно то, для чего годятся custom_rules.
  #
  # `\s*` покрывает и однострочную запись, и перенос после `OSLog(`: шесть из
  # восьми сайтов написаны в столбик, и `\s` в NSRegularExpression берёт `\n`.
  #
  # ⚠️ Что правило НЕ ловит — список проверен прогонами, а не рассуждением:
  #
  # 1. `AppLogger.fallbackSubsystem` — обычный литерал без метки `subsystem:`,
  #    регулярка его не видит. Это самая дорогая протухающая строка в файле, и
  #    держит её не линт, а `AppLoggerSubsystemTests.testTheFallbackLiteral…`.
  #    (`AppLogger.swift` при этом НЕ в excluded — просто срабатывать там
  #    нечему: после `subsystem:` стоит идентификатор.)
  # 2. Тест-таргет. CI линтует буквально `swiftlint lint --quiet
  #    SnoozePay/SnoozePay` (`ci.yml:71`) — `SnoozePayTests/` и `SnoozePayUITests/`
  #    не линтуются вообще, и литерал, внесённый туда, пройдёт.
  # 3. Строка, собранная не литералом: `let s = "io.mobilife." + name;
  #    Logger(subsystem: s, …)`. Класс сужен, а не закрыт.
  # 4. Перенос между `subsystem:` и кавычкой правило переживает (`\s*`), а вот
  #    комментарий между ними — нет.
  # 5. Короткий псевдоним типа: `typealias L = Logger; L(subsystem: "…")` — не
  #    ловится. (Псевдоним, чьё имя СОДЕРЖИТ `Logger`/`OSLog`, ловится побочно —
  #    альтернатива не заякорена на границу слова. Проверено обоими способами.)
  #    Ловится надёжно только регуляркой
  #    без привязки к типу (`'\(\s*subsystem:\s*#*"'`) — она на сегодняшнем
  #    дереве тоже даёт ноль, но красит ЛЮБОЙ API с меткой `subsystem:`, а не
  #    только os_log. При `severity: error` это цена, которую платит чужой PR,
  #    поэтому список типов оставлен.
  #
  # `#*` перед кавычкой закрывает raw string: `Logger(subsystem: #"io.mobilife…"#)`
  # обходил правило, потому что `#` стоял ровно между `\s*` и кавычкой.
  #
  # `match_kinds` отсекает комментарии: без него строка документации, буквально
  # цитирующая запрещённую запись, красила бы файл — то есть правило запрещало бы
  # объяснять, что оно запрещает. Список видов покрывает ровно то, из чего
  # состоит совпадение (`Logger` / `.init`, метку аргумента, открывающую кавычку).
  #
  # `\.init` в альтернативе закрывает обход `OSLog.init(subsystem: "…")` и
  # `let log: Logger = .init(subsystem: "…")` — вывод типа прячет имя типа, и
  # без этой ветки такая запись проходила.
  #
  # severity: error — в отличие от двух правил выше, здесь предсуществующего долга
  # нет (после #747 нарушений ноль на всём SnoozePay/SnoozePay), поэтому error
  # ничего не блокирует задним числом. Это то, что обещает шапка файла: «когда
  # счётчик дойдёт до нуля — правило поднимается до error, и класс закрыт
  # навсегда». С `warning` правило было бы видно, но не держало бы: CI падает
  # только на errors.
  #
  # ⚠️ Само решение «error» — за PM: `CLAUDE.md` пока говорит, что все custom-
  # правила здесь `warning`, и этот PR разводит два источника истины. Вопрос
  # вынесен в #772 с `pm-input-needed`; до ответа Ивана PR не мержится.
  literal_log_subsystem:
    name: "Литеральная подсистема os_log"
    regex: '(OSLog|Logger|\.init)\s*\(\s*subsystem:\s*#*"'
    match_kinds: [identifier, keyword, argument, parameter, string]
    message: "Подсистема прописана строкой — она молча разойдётся с bundle ID (#670). Передай AppLogger.subsystem."
    severity: error

# ── Согласование локального и CI-прогона ─────────────────────────────────────
# Локально стоит SwiftLint 0.52.2, в CI `brew install` ставит свежий. На дефолтах
# они расходятся: локально эти два правила дают 11 errors, в CI — ноль. Пока
# SwiftLint был необязательным чеком, расхождение никого не трогало; теперь он
# блокирует merge, и вердикт обязан быть одинаковым в обоих местах.
#
# Порог оставлен дефолтным, понижена только строгость: это предсуществующий долг
# (StatisticsViewModel, AlarmScheduler, ReferralViewController и ещё несколько),
# и превращать его в блокировку всех PR ради чужого технического долга нельзя.
type_body_length:
  warning: 350
  error: 1000

# Однобуквенные имена в коде отрисовки — не нарушение, а общепринятая запись:
# `x`/`y` в StatisticsHeatmapView читаются лучше, чем horizontalPosition.
identifier_name:
  excluded:
    - x
    - y
    - i
    - j
    - r
    - g
    - b
    - dx
    - dy
    - id
  min_length:
    warning: 3
    error: 1
